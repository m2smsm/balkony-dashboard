<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>تسجيل الدخول | لوحة تحكم Balkony</title>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="anonymous" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="css/variables.css"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/components.css"/>
<link rel="stylesheet" href="css/login.css"/>

<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="loginLogo" style="background:var(--gradient-neon);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;color:#1a1204;">B</div>
    <h1 class="login-title">لوحة تحكم المنيو</h1>
    <p class="login-sub">سجّل الدخول بحساب Google الخاص بمدونة Balkony لإدارة المنيو</p>

    <button type="button" class="login-btn" id="googleLoginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36.4 26.7 37 24 37c-5.3 0-9.6-3.4-11.3-8l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.2 5.2C40.9 36.2 45 30.6 45 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      <span>تسجيل الدخول عبر Google</span>
    </button>

    <div class="login-error" id="loginError"></div>
    <p class="login-foot">الوصول مقصور على مالك المطعم فقط</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/ui/loading.js"></script>
<script src="js/auth.js"></script>
<script>
  (function(){
    if(window.Auth.isLoggedIn()){
      window.location.href = 'app.html';
      return;
    }
    var btn = document.getElementById('googleLoginBtn');
    var errorBox = document.getElementById('loginError');

    btn.addEventListener('click', function(){
      errorBox.classList.remove('show');
      setButtonLoading(btn, true);
      window.Auth.login().then(function(){
        window.location.href = 'app.html';
      }).catch(function(err){
        setButtonLoading(btn, false);
        errorBox.textContent = err.message || 'تعذر تسجيل الدخول، حاول مرة أخرى';
        errorBox.classList.add('show');
      });
    });
  })();
</script>
</body>
</html>
